name: FreeBSD

# Builds and tests the SwiftPM package on FreeBSD 14 (x86_64), in a VM on a Linux runner. swift.org
# publishes no released Swift for FreeBSD yet, only a rolling development preview, which this
# installs; the ELF note reader (Sources/LinkerSetsRuntime/LinkerSetSection+ELF.swift) is the code
# under test. It runs when that code changes, not on every push, and by hand.
on:
  push:
    branches:
      - main
    paths:
      - 'Sources/LinkerSetsRuntime/LinkerSetSection+ELF.swift'
      - 'Sources/LinkerSetsRuntime/LinkerSetSection.swift'
      - 'Sources/LinkerSetsRuntime/LinkerSet.swift'
      - 'Sources/LinkerSetsMacroSupport/LinkerSetMacro.swift'
      - 'Sources/LinkerSetsMacroSupport/LinkerSetRecordMacro.swift'
      - 'Package.swift'
      - '.github/workflows/freebsd.yml'
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1.6.0
        with:
          release: '14.3'
          usesh: true
          mem: 12288
          prepare: |
            pkg install -y curl bash python3 sqlite3 libuuid zlib-ng git
          run: |
            set -eu
            curl -fsSL -o /tmp/swift.tar.gz https://download.swift.org/tmp-ci-nightly/development/freebsd-14_ci_latest.tar.gz
            mkdir -p /opt/swift
            tar -xzf /tmp/swift.tar.gz -C /opt/swift
            swift_bin=$(dirname "$(find /opt/swift -type f -path '*/usr/bin/swift-frontend' | head -1)")
            export PATH="$swift_bin:$PATH"
            swift --version
            swift build --build-tests 2>&1 | tee build.log
            # First-party warnings are errors, as in the Bazel build; a dependency's are left alone.
            if grep -E '/(Sources|Tests)/[^:]*\.swift:[0-9]+:[0-9]+: warning:' build.log | grep -v '/\.build/'; then
              exit 1
            fi
            swift test --skip-build
            swift build -c release -Xswiftc -enable-testing --build-tests
            swift test -c release --skip-build
